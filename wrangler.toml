name = "mekousai-79"
main = "src/cloudflare-entry.js"
compatibility_date = "2026-09-03"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mekousai-79-media"

[[d1_databases]]
binding = "DB"
database_name = "mekousai-79-gallery"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
