<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f2eadf">
<title>写真編集｜第79回 目高祭</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css?v=20260904-home-2"><link rel="stylesheet" href="gallery-system.css?v=20260904-home-2">
</head>
<body class="editor-page">
<main class="editor-shell">
  <div class="editor-topbar"><a class="editor-back" href="index.html">← 公開サイトへ</a><span class="gallery-brand">MEKOUSAI PHOTO EDITOR</span></div>
  <header class="editor-title"><span class="gallery-kicker">EDITOR</span><h1>写真を<br>ポンポン追加。</h1><p>iPhoneから複数枚を選び、カテゴリを選んで公開できます。公開サイトは再デプロイ不要で自動更新されます。</p><div class="editor-status" id="editor-status">API確認中</div></header>

  <section class="editor-panel editor-login" id="login-panel"><h2>編集者ログイン</h2><form id="login-form"><label class="editor-field"><span>編集用パスコード</span><input id="passcode" type="password" autocomplete="current-password" inputmode="numeric" required></label><div class="editor-actions"><button class="editor-button" type="submit">ログイン</button></div></form><p class="editor-note">パスコードはこのページやGitHubには保存しません。Cloudflare Worker側のSecretだけで照合します。</p></section>

  <div id="editor-app" class="editor-hidden">
    <section class="editor-panel"><h2>写真を追加</h2><form id="upload-form"><div class="editor-grid"><label class="editor-field"><span>カテゴリ</span><select id="upload-category" required></select></label><label class="editor-field"><span>撮影日</span><input id="upload-date" type="date"></label><label class="editor-field full"><span>一言コメント（任意）</span><textarea id="upload-caption" maxlength="500" placeholder="例：前日準備。教室装飾が一気に進みました。"></textarea></label><label class="editor-field full editor-filebox"><span>写真を選択（複数可）</span><input id="upload-files" type="file" accept="image/*" multiple required><small id="file-summary">未選択</small></label></div><label class="editor-row"><input id="upload-published" type="checkbox" checked> <strong>すぐ公開する</strong></label><p class="editor-note">公開前にブラウザ内で長辺1800pxのJPEGへ変換し、写真の位置情報などEXIFメタデータを除去します。</p><div class="editor-progress" aria-hidden="true"><span id="upload-progress"></span></div><div class="editor-actions"><button id="upload-button" class="editor-button" type="submit">選んだ写真を公開</button><button id="logout-button" class="editor-button secondary" type="button">ログアウト</button></div></form></section>

    <section class="editor-panel"><div class="editor-row" style="justify-content:space-between"><h2>追加済み写真</h2><label class="editor-field" style="min-width:190px"><span>表示カテゴリ</span><select id="manage-category"></select></label></div><p class="editor-note">コメント・日付・公開状態を変更できます。「代表にする」でトップのカード写真になります。</p><div class="editor-list" id="editor-list"></div></section>
  </div>
</main>
<div class="editor-toast" id="editor-toast" hidden></div>
