<body class="gallery-page">
<main class="gallery-shell">

  <header class="gallery-hero"><div><span class="gallery-kicker" id="gallery-kicker">PHOTO JOURNAL</span><h1 id="gallery-title">写真アルバム</h1><p id="gallery-description">目高祭の瞬間を、写真でたどります。</p></div><div class="gallery-total" id="gallery-total">読み込み中…</div></header>
  <nav class="festival-folder-nav" id="festival-folder-nav" aria-label="文化祭当日の写真分類" hidden></nav>

<div class="gallery-lightbox" id="gallery-lightbox" hidden role="dialog" aria-modal="true" aria-label="写真拡大表示"><div class="lightbox-toolbar"><span id="lightbox-counter"></span><button class="lightbox-close" type="button" aria-label="閉じる">×</button></div><div class="lightbox-stage"><button class="lightbox-nav lightbox-prev" type="button" aria-label="前の写真">←</button><img id="lightbox-image" alt=""><button class="lightbox-nav lightbox-next" type="button" aria-label="次の写真">→</button></div><div class="lightbox-caption" id="lightbox-caption"></div></div>
<div class="bgm-dock" data-open="false" id="bgm-player">

<button class="bgm-toggle" type="button" aria-expanded="false"><span class="bgm-playing-dot" hidden></span><span class="bgm-toggle-label">BGMを聴く</span></button>
<section class="cassette-player" hidden aria-label="BGMプレイヤー"><button class="cassette-close" type="button" aria-label="BGMプレイヤーを閉じる">×</button><div class="cassette-label"><span>BGM • SIDE A</span><strong>Summer Sketchbook</strong><small>instrumental / loop</small></div><div class="cassette-window" aria-hidden="true"><span class="cassette-reel"></span><span class="cassette-tape"></span><span class="cassette-reel"></span></div><div class="cassette-controls"><button class="cassette-play" type="button" aria-label="BGMを再生"><span>▶</span><b>PLAY</b></button><label class="volume-control"><span>VOL</span><input type="range" min="0" max="1" step="0.01" value="0.22"><output>22%</output></label></div><div class="cassette-status"><span class="status-led"></span><span class="cassette-status-text">停止中</span></div></section>
